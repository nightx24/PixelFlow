name: Android build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare stable signing key (optional)
        if: ${{ secrets.PIXELFLOW_KEYSTORE_BASE64 != '' }}
        env:
          PIXELFLOW_KEYSTORE_BASE64: ${{ secrets.PIXELFLOW_KEYSTORE_BASE64 }}
          PIXELFLOW_KEY_ALIAS: ${{ secrets.PIXELFLOW_KEY_ALIAS }}
          PIXELFLOW_KEY_PASSWORD: ${{ secrets.PIXELFLOW_KEY_PASSWORD }}
          PIXELFLOW_STORE_PASSWORD: ${{ secrets.PIXELFLOW_STORE_PASSWORD }}
        run: |
          echo "$PIXELFLOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixelflow-signing.jks"
          echo "PIXELFLOW_KEYSTORE_FILE=$RUNNER_TEMP/pixelflow-signing.jks" >> "$GITHUB_ENV"
          echo "PIXELFLOW_KEY_ALIAS=$PIXELFLOW_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PIXELFLOW_KEY_PASSWORD=$PIXELFLOW_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "PIXELFLOW_STORE_PASSWORD=$PIXELFLOW_STORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
