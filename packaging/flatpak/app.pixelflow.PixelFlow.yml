app-id: app.pixelflow.PixelFlow
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron.BaseApp
base-version: '23.08'
command: pixelflow
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=host:ro
  - --filesystem=xdg-videos:rw
  - --filesystem=xdg-download:rw
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.PowerManagement

modules:
  - name: pixelflow
    buildsystem: simple
    build-commands:
      - install -D pixelflow /app/bin/pixelflow
      - install -D app.pixelflow.PixelFlow.desktop /app/share/applications/app.pixelflow.PixelFlow.desktop
      - install -D app.pixelflow.PixelFlow.metainfo.xml /app/share/metainfo/app.pixelflow.PixelFlow.metainfo.xml
      - install -D app.pixelflow.PixelFlow.svg /app/share/icons/hicolor/scalable/apps/app.pixelflow.PixelFlow.svg
    sources:
      - type: file
        path: app.pixelflow.PixelFlow.desktop
      - type: file
        path: app.pixelflow.PixelFlow.metainfo.xml
      - type: file
        path: app.pixelflow.PixelFlow.svg
      - type: script
        dest-filename: pixelflow
        commands:
          - exec zypak-wrapper /app/pixelflow-app/pixelflow "$@"
